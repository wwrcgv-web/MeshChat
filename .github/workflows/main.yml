name: Build MeshChat APK

'on':
  workflow_dispatch:
  push:
    paths:
      - "MeshChat_prototype_android.zip"
      - ".github/workflows/main.yml"
      - "overlay/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: unzip -o MeshChat_prototype_android.zip -d extracted

      - name: Apply overlay
        run: |
          if [ -d overlay ]; then cp -r overlay/. extracted/MeshChat/; fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fix Kotlin target
        run: |
          FILE=$(find extracted -path '*/app/build.gradle.kts' -type f | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Fichier app/build.gradle.kts introuvable"
            exit 1
          fi
          printf '\n\ntasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {\n    kotlinOptions.jvmTarget = "1.8"\n}\n' >> "$FILE"

      - name: Décoder le keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/samchat.p12"
          test -s "$RUNNER_TEMP/samchat.p12" || { echo "Keystore vide : secret KEYSTORE_BASE64 absent ?"; exit 1; }

      - name: Build APK signé
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/samchat.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          FILE=$(find extracted -path '*/app/build.gradle.kts' -type f | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Fichier app/build.gradle.kts introuvable"
            exit 1
          fi
          cd "$(dirname "$FILE")"
          gradle assembleRelease
          # Une build release non signée ne doit pas être publiée en silence
          test -n "$(find build/outputs/apk/release -name 'app-release.apk')" \
            || { echo "APK non signée : vérifier RELEASE_KEYSTORE et les secrets"; exit 1; }

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MeshChat-APK-release
          path: extracted/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
