name: Build MeshChat APK
'on':
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '17'
- name: Extract project
run: unzip -o MeshChat_prototype_android.zip -d project
- name: Build APK
run: |
WRAPPER=$(find project -name gradlew -type f | head -n 1)
test -n "$WRAPPER" || { echo "Gradle wrapper not found"; exit 1; }
DIR=$(dirname "$WRAPPER")
cd "$DIR"
chmod +x gradlew
./gradlew assembleDebug
- name: Save APK
uses: actions/upload-artifact@v4
with:
name: MeshChat-APK
path: project/**/build/outputs/apk/debug/*.apk
