name: Build MeshChat APK
on: {workflow_dispatch: {}}
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '17'
- name: Extract project
run: unzip -o MeshChat_prototype_android.zip -d extracted
- name: Build APK
run: |
FILE=$(find extracted -name gradlew -type f | head -n 1)
if [ -z "$FILE" ]; then echo "gradlew introuvable dans le ZIP"; find extracted -maxdepth 4 -type f | head -n 80; exit 1; fi
DIR=$(dirname "$FILE")
cd "$DIR"
chmod +x gradlew
./gradlew assembleDebug
- uses: actions/upload-artifact@v4
if: success()
with:
name: MeshChat-APK
path: extracted/**/build/outputs/apk/debug/*.apk
if-no-files-found: error
