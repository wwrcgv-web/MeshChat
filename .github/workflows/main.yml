name: Build MeshChat APK

on:
workflow_dispatch:
push:
paths:
- "MeshChat_prototype_android.zip"
- ".github/workflows/main.yml"

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Extract project
    run: unzip -o MeshChat_prototype_android.zip -d project

  - name: Find Gradle wrapper and build
    run: |
      WRAPPER=$(find project -name gradlew -type f | head -n 1)
      if [ -z "$WRAPPER" ]; then
        echo "Gradle wrapper not found"
        exit 1
      fi
      PROJECT_DIR=$(dirname "$WRAPPER")
      cd "$PROJECT_DIR"
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MeshChat-APK
      path: project/**/build/outputs/apk/debug/*.apk
