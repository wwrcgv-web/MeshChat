name: Build MeshChat APK

'on':
  workflow_dispatch:
  push:
    paths:
      - "MeshChat_prototype_android.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: unzip -o MeshChat_prototype_android.zip -d extracted

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          ROOT=$(find extracted -name build.gradle.kts -o -name build.gradle | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "No Gradle build file found in extracted ZIP"
            find extracted -maxdepth 4 -type f | head -n 80
            exit 1
          fi
          DIR=$(dirname "$ROOT")
          cd "$DIR"
          gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MeshChat-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
